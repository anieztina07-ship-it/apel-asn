<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Login APEL ASN</title>
<style>
  :root { --bg:#0b1628; --kartu:#14233b; --teks:#e8eef7; --aksen:#f59e0b; --garis:#2a3d5c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--teks); font:16px/1.5 system-ui, sans-serif; }
  main { width:100%; max-width:420px; background:var(--kartu); border:1px solid var(--garis);
         border-radius:12px; padding:24px; }
  h1 { font-size:1.25rem; margin:0 0 4px; color:var(--aksen); }
  p.sub { margin:0 0 20px; font-size:.9rem; opacity:.8; }
  label { display:block; margin:12px 0 4px; font-size:.9rem; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--garis);
          background:var(--bg); color:var(--teks); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--aksen); outline-offset:2px; }
  button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:8px;
           background:var(--aksen); color:#1a1200; font:inherit; font-weight:600; cursor:pointer; }
  button.sekunder { background:transparent; color:var(--teks); border:1px solid var(--garis); }
  button:disabled { opacity:.6; cursor:wait; }
  #pesan { margin-top:14px; font-size:.9rem; min-height:1.4em; }
  #pesan.error { color:#ff8a8a; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:16px 0 0; font-size:.95rem; }
  dt { opacity:.7; } dd { margin:0; word-break:break-all; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>APEL ASN — Tes Koneksi</h1>
  <p class="sub">Halaman uji untuk memastikan GitHub Pages dan Supabase sudah tersambung.</p>

  <form id="formLogin">
    <label for="username">Nama pengguna</label>
    <input id="username" name="username" autocomplete="username" required placeholder="contoh: dev">
    <label for="password">Kata sandi</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="tombolMasuk">Masuk</button>
  </form>

  <section id="hasil" hidden>
    <dl>
      <dt>Pengguna</dt><dd id="outUser"></dd>
      <dt>Peran</dt><dd id="outRole"></dd>
      <dt>OPD</dt><dd id="outOpd"></dd>
      <dt>OPD terlihat</dt><dd id="outJumlahOpd"></dd>
    </dl>
    <button type="button" id="tombolKeluar" class="sekunder">Keluar</button>
  </section>

  <div id="pesan" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // ====== ISI DUA BARIS INI (Supabase > Project Settings > API) ======
  const SUPABASE_URL = 'https://uyrgslbeunjctntxpgdk.supabase.co';          // contoh: https://abcdxyz.supabase.co
  const SUPABASE_ANON_KEY = 'sb_publishable_qFB1DW64CnVVWHxNzIPNFg_6VQY2ruU'; // kunci "anon public" SAJA, bukan service_role
  // ===================================================================

  const DOMAIN_EMAIL = '@apel.local';
  const $ = (id) => document.getElementById(id);
  const pesan = (teks, error = false) => { $('pesan').textContent = teks; $('pesan').className = error ? 'error' : ''; };

  if (SUPABASE_URL.startsWith('ISI_') || SUPABASE_ANON_KEY.startsWith('ISI_')) {
    pesan('Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas skrip file ini terlebih dahulu.', true);
    $('tombolMasuk').disabled = true;
  }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function tampilkan(session) {
    const u = session.user, meta = u.app_metadata || {};
    $('outUser').textContent = u.email.replace(DOMAIN_EMAIL, '');
    $('outRole').textContent = meta.role || '(belum ada peran)';
    $('outOpd').textContent = meta.opd_id || '(semua / tidak terikat OPD)';
    // Uji RLS: tiap peran hanya boleh melihat OPD sesuai haknya
    const { data, error } = await db.from('opd').select('kode');
    $('outJumlahOpd').textContent = error ? 'gagal: ' + error.message
      : data.length + (data.length ? ' (' + data.map((o) => o.kode).join(', ') + ')' : '');
    $('formLogin').hidden = true;
    $('hasil').hidden = false;
  }

  $('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('tombolMasuk').disabled = true;
    pesan('Memeriksa...');
    const email = $('username').value.trim().toLowerCase() + DOMAIN_EMAIL;
    const { data, error } = await db.auth.signInWithPassword({ email, password: $('password').value });
    $('tombolMasuk').disabled = false;
    if (error) return pesan('Login gagal: nama pengguna atau kata sandi salah.', true);
    pesan('Login berhasil.');
    await tampilkan(data.session);
  });

  $('tombolKeluar').addEventListener('click', async () => {
    await db.auth.signOut();
    $('hasil').hidden = true;
    $('formLogin').hidden = false;
    $('password').value = '';
    pesan('Anda sudah keluar.');
  });

  // Jika sesi masih tersimpan di browser, langsung tampilkan
  db.auth.getSession().then(({ data }) => { if (data.session) tampilkan(data.session); });
</script>
</body>
</html>
